<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RESQNET RQ-01 — Hybrid VTOL Disaster Response Drone</title>
  <meta name="description" content="High-fidelity 3D virtual prototype showcase of the custom Hybrid VTOL Disaster Response Drone with 25 mapped engineering components." />
  <meta property="og:title" content="RESQNET RQ-01 — Hybrid VTOL Disaster Response Drone" />
  <meta property="og:description" content="Interactive 3D virtual prototype showcase with 25 mapped subsystems and cinematic GSAP camera navigation." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js, OrbitControls & GSAP via cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #09090b;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e4e4e7;
    }

    /* Fullscreen 3D Canvas */
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      cursor: grab;
    }
    #canvas-container:active {
      cursor: grabbing;
    }

    /* Top Left Minimal Drone Badge */
    .brand-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(24, 24, 27, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 6px 14px;
      border-radius: 9999px;
      width: fit-content;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4d00;
      box-shadow: 0 0 10px #ff4d00;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    .brand-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
    }
    .brand-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #ff5500;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(255, 77, 0, 0.5);
    }
    .color-tags {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .color-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-orange { background: rgba(255, 77, 0, 0.2); color: #ff5500; border: 1px solid rgba(255, 77, 0, 0.5); }
    .badge-white { background: rgba(255, 255, 255, 0.15); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.45); }

    /* Floating Action Tools (Left Side) */
    .floating-tools {
      position: absolute;
      top: 50%;
      left: 24px;
      transform: translateY(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .action-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(24, 24, 27, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #d4d4d8;
      padding: 10px 16px;
      border-radius: 8px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .action-btn:hover {
      background: rgba(39, 39, 42, 0.95);
      border-color: #ffd700;
      color: #ffffff;
      transform: translateX(4px);
    }
    .action-btn.active {
      background: #ffd700;
      color: #09090b;
      border-color: #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.45);
    }
    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Top Right Floating Close View Panel */
    #close-view-panel {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 20;
      width: 360px;
      max-width: calc(100vw - 48px);
      background: rgba(24, 24, 27, 0.88);
      border: 1px solid rgba(255, 215, 0, 0.35);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 18px 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 30px rgba(255, 215, 0, 0.12);
      display: none;
      transform: translateY(-20px);
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #close-view-panel.visible {
      display: block;
      transform: translateY(0);
      opacity: 1;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }
    .panel-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ff5500;
      background: rgba(255, 77, 0, 0.15);
      border: 1px solid rgba(255, 77, 0, 0.35);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .panel-qty {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .panel-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 19px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .panel-role-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }
    .panel-role {
      font-size: 13px;
      line-height: 1.5;
      color: #e4e4e7;
      margin-bottom: 16px;
      font-weight: 400;
    }
    .btn-close-view {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: linear-gradient(135deg, #ff5500 0%, #ff4d00 100%);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(255, 77, 0, 0.4);
    }
    .btn-close-view:hover {
      background: linear-gradient(135deg, #ff6611 0%, #ff5500 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(255, 77, 0, 0.6);
    }
    .btn-close-view svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
    }

    /* Bottom Frosted-Glass Slider Overlay */
    #components-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      z-index: 20;
      background: rgba(24, 24, 27, 0.82);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 24px 18px 24px;
      box-shadow: 0 -12px 36px rgba(0, 0, 0, 0.65);
    }
    .overlay-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .overlay-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .overlay-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
    }
    .overlay-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #ff5500;
      background: rgba(255, 77, 0, 0.12);
      border: 1px solid rgba(255, 77, 0, 0.35);
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .scroll-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #71717a;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Horizontal Cards Slider */
    .slider-track {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      gap: 12px;
      padding-bottom: 6px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 77, 0, 0.4) rgba(255, 255, 255, 0.05);
      scroll-behavior: smooth;
    }
    .slider-track::-webkit-scrollbar {
      height: 4px;
    }
    .slider-track::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 4px;
    }
    .slider-track::-webkit-scrollbar-thumb {
      background: rgba(255, 77, 0, 0.4);
      border-radius: 4px;
    }
    .slider-track::-webkit-scrollbar-thumb:hover {
      background: #ff4d00;
    }

    /* Individual Component Card */
    .component-card {
      flex: 0 0 250px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }
    .component-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 77, 0, 0.5);
      transform: translateY(-3px);
    }
    .component-card.active {
      background: rgba(255, 77, 0, 0.1);
      border-color: #ff4d00;
      box-shadow: 0 0 20px rgba(255, 77, 0, 0.35), inset 0 0 12px rgba(255, 77, 0, 0.08);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      color: #ff5500;
    }
    .card-qty {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 1px 6px;
      border-radius: 3px;
    }
    .card-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #f4f4f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
      transition: color 0.2s;
    }
    .component-card:hover .card-name,
    .component-card.active .card-name {
      color: #ffffff;
    }
    .card-role {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10.5px;
      color: #a1a1aa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .brand-overlay { top: 16px; left: 16px; }
      .floating-tools { left: 16px; }
      #close-view-panel { top: 16px; right: 16px; width: calc(100vw - 32px); }
      #components-overlay { padding: 10px 16px 14px; }
      .component-card { flex: 0 0 210px; }
    }
  </style>
</head>
<body>

      grad.addColorStop(0, '#1c2230');
      grad.addColorStop(0.45, '#0c0f14');
      grad.addColorStop(0.7, '#07080a');
      grad.addColorStop(1, '#030406');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1024, 512);

      // Overhead Softbox Light (Broad Diffuse Key)
      const topLight = ctx.createRadialGradient(512, 80, 10, 512, 80, 220);
      topLight.addColorStop(0, '#ffffff');
      topLight.addColorStop(0.5, '#cbd5e1');
      topLight.addColorStop(1, 'rgba(203, 213, 225, 0)');
      ctx.fillStyle = topLight;
      ctx.fillRect(0, 0, 1024, 260);

      // Left Key Light (Neutral White Daylight)
      const leftLight = ctx.createRadialGradient(240, 220, 15, 240, 220, 170);
      leftLight.addColorStop(0, '#f8fafc');
      leftLight.addColorStop(0.6, '#64748b');
      leftLight.addColorStop(1, 'rgba(100, 116, 139, 0)');
      ctx.fillStyle = leftLight;
      ctx.fillRect(50, 60, 380, 320);

      // Right Fill Light (Cool Electric Cyan / Sky Fill)

    // Procedural Rescue Composite Weave Texture
    function createOrangeWeaveTexture() {
      const c = document.createElement('canvas');
      c.width = 128;
      c.height = 128;
      const ctx = c.getContext('2d');

      ctx.fillStyle = '#ff4d00';
      ctx.fillRect(0, 0, 128, 128);

      const step = 16;
      for (let y = 0; y < 128; y += step) {
        for (let x = 0; x < 128; x += step) {
          const isAlt = ((x / step) + (y / step)) % 2 === 0;
          ctx.fillStyle = isAlt ? '#ff5a10' : '#e64500';
          ctx.fillRect(x, y, step, step);

          ctx.strokeStyle = isAlt ? 'rgba(255,255,255,0.18)' : 'rgba(0,0,0,0.12)';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + step, y + step);
          ctx.stroke();
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 16);
      return tex;
    }

    const btnReset = document.getElementById('btn-reset');

    let activeComponent = null;
    let isExploded = false;
    let explodedProgress = { value: 0 };

    COMPONENTS.forEach((comp, idx) => {
      const card = document.createElement('div');
      card.className = 'component-card';
      card.id = `card-${comp.id}`;
      card.innerHTML = `
        <div class="card-top">
          <span class="card-num">[${comp.num}]</span>
          <span class="card-qty">${comp.qty}</span>
        </div>
        <div class="card-name">${comp.name}</div>
        <div class="card-role">${comp.role}</div>
      `;
      card.addEventListener('click', () => {
        focusComponent(comp);
      });
      sliderTrack.appendChild(card);
    });

    // =========================================================================
    // CINEMATIC GSAP CAMERA ZOOM-IN & CLOSE VIEW LOGIC
    // =========================================================================
    function focusComponent(comp) {
      activeComponent = comp;

      // Highlight active card & scroll card into view
      document.querySelectorAll('.component-card').forEach((c) => c.classList.remove('active'));
      const activeCard = document.getElementById(`card-${comp.id}`);
      if (activeCard) {
        activeCard.classList.add('active');
        activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }

      // Populate Floating Close View Panel
      panelBadge.textContent = `[${comp.num}]`;
      panelQty.textContent = comp.qty;
      panelTitle.textContent = comp.name;
      panelRole.textContent = comp.role;
      closeViewPanel.classList.add('visible');

      // Calculate dynamic offset if in exploded mode
      const expMul = isExploded ? 1.0 : 0.0;
      const targetVec = {
        x: comp.target[0] + comp.explodedOffset[0] * expMul,
        y: comp.target[1] + comp.explodedOffset[1] * expMul,
        z: comp.target[2] + comp.explodedOffset[2] * expMul
      };

      const camVec = {
        x: comp.cam[0] + comp.explodedOffset[0] * expMul * 0.8,
        y: comp.cam[1] + comp.explodedOffset[1] * expMul * 0.8,
        z: comp.cam[2] + comp.explodedOffset[2] * expMul * 0.8
      };

      // Cinematic GSAP Camera & Orbit Controls Transition
      window.gsap.killTweensOf(camera.position);
      window.gsap.killTweensOf(controls.target);

      window.gsap.to(camera.position, {
        x: camVec.x,
        y: camVec.y,
        z: camVec.z,
        duration: 1.3,
        ease: 'power2.inOut'
      });

      window.gsap.to(controls.target, {
        x: targetVec.x,
        y: targetVec.y,
        z: targetVec.z,
        duration: 1.3,
        ease: 'power2.inOut',
        onUpdate: () => controls.update()
      });
    }

    // Gracefully Zoom Camera Back Out to Assembled Overview
    function closeComponentView() {
      activeComponent = null;
      document.querySelectorAll('.component-card').forEach((c) => c.classList.remove('active'));
      closeViewPanel.classList.remove('visible');

      window.gsap.killTweensOf(camera.position);
      window.gsap.killTweensOf(controls.target);

      window.gsap.to(camera.position, {
        x: DEFAULT_CAM.x,
        y: DEFAULT_CAM.y,
        z: DEFAULT_CAM.z,
        duration: 1.3,
        ease: 'power2.inOut'
      });

      window.gsap.to(controls.target, {
        x: DEFAULT_TARGET.x,
        y: DEFAULT_TARGET.y,
        z: DEFAULT_TARGET.z,
        duration: 1.3,
        ease: 'power2.inOut',
        onUpdate: () => controls.update()
      });
    }

    btnCloseView.addEventListener('click', closeComponentView);
    btnReset.addEventListener('click', closeComponentView);

    // =========================================================================
    // EXPLODED VIEW SMOOTH GSAP ANIMATION
    // =========================================================================
    const explodedItems = droneModel.userData.explodedItems || [];

    function toggleExplodedView() {
      isExploded = !isExploded;
      btnExplode.classList.toggle('active', isExploded);

      const targetVal = isExploded ? 1.0 : 0.0;

      window.gsap.to(explodedProgress, {
        value: targetVal,
        duration: 1.4,
        ease: 'power2.inOut',
        onUpdate: () => {
          explodedItems.forEach((item) => {
            item.object.position.lerpVectors(
              item.initialPos,
              item.initialPos.clone().add(item.explodedOffset),
              explodedProgress.value
            );
          });
        },
        onComplete: () => {
          if (activeComponent) {
            focusComponent(activeComponent);
          }
        }
      });
    }
    btnExplode.addEventListener('click', toggleExplodedView);

    // Mouse Wheel Horizontal Scroll Helper for Bottom Slider
    sliderTrack.addEventListener('wheel', (e) => {
      if (e.deltaY !== 0) {
        e.preventDefault();
        sliderTrack.scrollLeft += e.deltaY * 1.5;
      }
    }, { passive: false });

    // =========================================================================
    // ANIMATION RENDER LOOP (Continuous Smooth Hover & Propeller Spins)
    // =========================================================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Delegate update to drone model (spins VTOL props, cruise pusher, pulses Jetson status LED)
      if (droneModel.userData.update) {
        droneModel.userData.update(delta, time);
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Window Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
